---
services:
  vault-devcontainer:
    tty: true
    # Build the container from the Dockerfile before we run it
    build:
      context: .
      dockerfile: Dockerfile
    # Forward stop signals and reap zombie processes
    init: true
    # Run Vault in dev mode (in-memory, unsealed, root token "root") in the background,
    # so the container stays up even if Vault fails to start. Vault's output goes to
    # `docker logs` and /tmp/vault.log, which the welcome banner points to.
    entrypoint:
      - /bin/sh
      - -c
      - docker-entrypoint.sh server -dev 2>&1 | tee /tmp/vault.log & exec sleep infinity
    ports:
      - "8200:8200" # vault api and ui
    volumes:
      # Mounts the project folder into the container
      - "../:/app"
      # Mount your ~/.ssh folder into the container
      # for Authenticating to Github
      - "~/.ssh:/home/vault/.ssh"
      # For GPG Auth to Github
      - "~/.gnupg:/home/vault/.gnupg"
    working_dir: "/app"
    environment:
      - GPG_TTY=/dev/pts/1
      - VAULT_ADDR=http://127.0.0.1:8200
      # Dev mode never locks memory, so skip the image's setcap step. It fails
      # where the capability isn't available (e.g. GitHub Codespaces) and stops the container
      - SKIP_SETCAP=true
